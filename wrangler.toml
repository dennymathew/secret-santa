name = "berlinmallusanta"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "berlinmallusanta"
# Replace with the id printed by `npx wrangler d1 create berlinmallusanta`
database_id = "fbb3ecc8-77e6-4f32-bb99-9f8a508d6377"
migrations_dir = "migrations"

[vars]
# Your Firebase project id (Project settings → General)
FIREBASE_PROJECT_ID = "secretsantaberlinmallus"
# ADMIN_PHONES (and optionally ADMIN_EMAILS) are set as secrets, so phone numbers stay out of git:
#   npx wrangler pages secret put ADMIN_PHONES --project-name berlinmallusanta
# After this moment the site is closed
GAME_ENDS_AT = "2026-12-26T00:00:00+01:00"
# Approvals needed before the admin can see all matches
UNSEAL_QUORUM = "5"

# ---------------------------------------------------------------------------
# TEST SITE = every Cloudflare Pages *preview* deployment (any branch except main),
# e.g. push a `test` branch → https://test.berlinmallusanta.pages.dev
# It has its OWN database, so testing never touches the real game.
# Every listed number signs in with code 123456 (no SMS). TEST_MODE is ignored on main.
# Pages doesn't inherit vars/bindings into environments, so everything is repeated here.
# Secrets (MATCH_KEY, ADMIN_PASSWORD_HASH, ADMIN_PHONES) must be set for preview too: see README.
# ---------------------------------------------------------------------------
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "berlinmallusanta-test"
# Replace with the id printed by `npx wrangler d1 create berlinmallusanta-test`
database_id = "f652cb05-13e5-464f-8cbc-ef1a69f2b5b0"
migrations_dir = "migrations"

[env.preview.vars]
TEST_MODE = "1"
FIREBASE_PROJECT_ID = "secretsantaberlinmallus"
GAME_ENDS_AT = "2026-12-26T00:00:00+01:00"
UNSEAL_QUORUM = "5"
